# Native IS adapter configuration. No TrendRadar AI, notification, or SQLite runtime is used.
# NewsNow-compatible API: https://github.com/ourongxing/newsnow
newsnow:
  api_url: "https://newsnow.busiyi.world/api/s"
  timeout_seconds: 10
  max_retries: 2
  sources:
    - id: "baidu"
      name: "百度热搜"
      expected_domain: "baidu.com"
    - id: "weibo"
      name: "微博"
      expected_domain: "weibo.com"
    - id: "thepaper"
      name: "澎湃新闻"
      expected_domain: "thepaper.cn"
    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
      expected_domain: "wallstreetcn.com"
    - id: "cls-hot"
      name: "财联社热门"
      expected_domain: "cls.cn"
    - id: "zhihu"
      name: "知乎"
      expected_domain: "zhihu.com"
    - id: "bilibili-hot-search"
      name: "Bilibili 热搜"
      expected_domain: "bilibili.com"

rss:
  timeout_seconds: 15
  feeds:
    - id: "openai-news"
      name: "OpenAI News"
      url: "https://openai.com/news/rss.xml"
    - id: "google-deepmind"
      name: "Google DeepMind"
      url: "https://deepmind.google/blog/rss.xml"
    - id: "hugging-face-blog"
      name: "Hugging Face Blog"
      url: "https://huggingface.co/blog/feed.xml"
    - id: "nvidia-technical-blog"
      name: "NVIDIA Technical Blog"
      url: "https://developer.nvidia.com/blog/feed/"
    - id: "sec-press-releases"
      name: "U.S. SEC Press Releases"
      url: "https://www.sec.gov/news/pressreleases.rss"
    - id: "federal-reserve-press-releases"
      name: "Federal Reserve Press Releases"
      url: "https://www.federalreserve.gov/feeds/press_all.xml"
    - id: "coindesk"
      name: "CoinDesk"
      url: "https://www.coindesk.com/arc/outboundfeeds/rss/"
    - id: "techcrunch"
      name: "TechCrunch"
      url: "https://techcrunch.com/feed/"
    - id: "github-changelog"
      name: "GitHub Changelog"
      url: "https://github.blog/changelog/feed/"
    - id: "hacker-news"
      name: "Hacker News"
      url: "https://hnrss.org/frontpage"
