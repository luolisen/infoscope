name: infoscope

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infoscope}
      POSTGRES_USER: ${POSTGRES_USER:-infoscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infoscope-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infoscope} -d ${POSTGRES_DB:-infoscope}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
